{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes utilizadas -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
 
    <link rel="stylesheet" type="text/css" href="{% static 'Chatbot/style_chatbot.css' %}">
    <link rel="website icon" href="{% static 'icon_consola.png' %}" type="image/png">

    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   


    <title>Chatbot IA</title>
</head>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f7f7f7;
        color: #333;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-end;
        height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .header-container {
        position: absolute;
        top: 65px;
        left: 20px;
        width: auto;
    }
    h1 {
        color: #e63946;
        margin: 0;
    }
    #chat-box {
        width: 800px; /* Ancho más pequeño para el chatbox */
        height: 435px; /* Altura más pequeña para el chatbox */
        border: 1px solid #ccc;
        border-radius: 8px;
        overflow-y: auto;
        padding: 25px;
        background-color: white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        word-wrap: break-word;
        display: flex;
        flex-direction: column;
    }
    #user-input {
        width: 100%; /* Ancho al 100% para que ocupe todo el espacio disponible */
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s;
        box-sizing: border-box; /* Asegura que el padding no afecte el tamaño total */
    }
    #user-input:focus {
        border-color: #e63946;
    }
    #send-btn {
        padding: 10px 20px;
        background-color: #f13847;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-left: 10px;
    }
    #send-btn:hover {
        background-color: #e63946;
    }
    .message {
        margin: 10px 0;
        padding: 10px;
        border-radius: 20px;
        max-width: 80%;
        word-wrap: break-word;
    }
    .user-message {
        background-color: #e95252;
        align-self: flex-end;
        border-bottom-right-radius: 0;
        color: #ffffff;
    }
    .bot-message {
        background-color: #6755cc;
        align-self: flex-start;
        border-bottom-left-radius: 0;
        color: #ffffff;
    }
    .input-container {
        display: flex;
        align-items: center;
        margin-top: 10px;
        width: 100%; /* Ajusta el contenedor al ancho completo */
    }
    .chat-container {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }
</style>
</head>
<body>
<div class="header-container">
    <h1>CHATBOT ConsoleXpress</h1>
</div>
<div class="chat-container">
    <div id="chat-box"></div>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje..." />
        <button id="send-btn">Enviar</button>
    </div>
</div>

<script>
    $(document).ready(function() {
        function typeWriter(text, element, delay = 100) {
            let index = 0;
            
            function type() {
                if (index < text.length) {
                    element.append(text.charAt(index));
                    index++;
                    setTimeout(type, delay);
                }
            }
            
            type();
        }

        $("#send-btn").click(function() {
            var userMessage = $("#user-input").val();
            if (userMessage.trim() !== "") {
                $("#chat-box").append("<div class='message user-message'><strong>Tú:</strong> " + userMessage + "</div>");
                $("#user-input").val("");

                $.post("/chat", { message: userMessage }, function(data) {
                    $("#chat-box").append("<div class='message bot-message'><strong>Chatbot:</strong> </div>");
                    var botMessageElement = $("#chat-box").children().last();
                    setTimeout(function() {
                        typeWriter(data.response, botMessageElement, 50);
                        $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                    }, 1000); 
                });
            }
        });

        $("#user-input").keypress(function(e) {
            if (e.which == 13) {
                $("#send-btn").click();
            }
        });
    });
</script>
    
</body>
</html>
