{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes utilizadas -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
 
    <link rel="stylesheet" type="text/css" href="{% static 'Chatbot/style_chatbot.css' %}">
    <link rel="website icon" href="{% static 'icon_consola.png' %}" type="image/png">

    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   
    <title>Chatbot IA</title>
</head>

<header>
    <h1>CHATBOT ConsoleXpress</h1>
</header>

</head>

<body>

<div class="chat-container">
    <div id="chat-box"></div>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje..." />
        <button id="send-btn">Enviar</button>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Función para simular el efecto de máquina de escribir
        function typeWriter(text, element, delay = 100) {
            let index = 0;

            function type() {
                if (index < text.length) {
                    element.append(text.charAt(index));
                    index++;
                    setTimeout(type, delay);
                }
            }

            type();
        }

        // Evento para enviar el mensaje al hacer clic en el botón
        $("#send-btn").click(function() {
            var userMessage = $("#user-input").val();
            if (userMessage.trim() !== "") {
                // Agrega el mensaje del usuario al chat
                $("#chat-box").append("<div class='message user-message'><strong>Tú:</strong> " + userMessage + "</div>");
                $("#user-input").val("");

                // Enviar mensaje al servidor mediante POST
                $.post("/chat/", { message: userMessage }, function(data) { // Asegúrate de que sea /chat/ con la barra final
                    $("#chat-box").append("<div class='message bot-message'><strong>Chatbot:</strong> </div>");
                    var botMessageElement = $("#chat-box").children().last();
                    setTimeout(function() {
                        // Efecto de máquina de escribir para la respuesta del bot
                        typeWriter(data.response, botMessageElement, 50);
                        // Desplazar el chat hacia abajo para mostrar el último mensaje
                        $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                    }, 1000); 
                }).fail(function() {
                    // Manejo de errores si falla la solicitud al servidor
                    $("#chat-box").append("<div class='message bot-message error'><strong>Chatbot:</strong> Hubo un error al procesar tu mensaje.</div>");
                });
            }
        });

        // Evento para enviar el mensaje al presionar Enter
        $("#user-input").keypress(function(e) {
            if (e.which == 13) {
                $("#send-btn").click();
            }
        });
    });
</script>
    
</body>
</html>
