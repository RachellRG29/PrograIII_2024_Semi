            .left-image {
    position: absolute;
    top: 130px; /* Ajusta la posición vertical */
    left: 10px; /* Ajusta la posición horizontal */
    width: 500px; /* Ajusta el ancho del cuadrado */
    height: 400px; /* Ajusta el alto del cuadrado */
    background-image: url("{% static 'Chatbot/nahun3.png' %}");
    background-size: cover;
    background-repeat: no-repeat;
    transition: transform 0.3s ease, box-shadow 0.3s ease; /* Suaviza la transición */
}

.left-image:hover {
    animation: move-scale-rotate 3s ease forwards; /* Aplica la animación completa */
}

/* Definimos la animación combinada */
@keyframes move-scale-rotate {
    0% {
        transform: scale(1) translateX(0) rotate(0deg); /* Estado inicial */
    }
    25% {
        transform: scale(1.2) translateX(20px) rotate(0deg); /* Mueve a la derecha */
    }
    50% {
        transform: scale(1.2) translateX(-20px) rotate(0deg); /* Mueve a la izquierda */
    }
    75% {
        transform: scale(1.1) translateX(0) rotate(15deg); /* Gira hacia la derecha */
    }
    87.5% {
        transform: scale(1.1) translateX(0) rotate(-15deg); /* Gira hacia la izquierda */
    }
    100% {
        transform: scale(1.1) translateX(0) rotate(0deg); /* Regresa al centro */
        
    }
    
}

<body>
    <h2>ConsoleXpress</h2>
<div class="chat-container">
    <div id="chat-box"></div>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje..." />
        <button id="send-btn">
            <div class="svg-wrapper-1">
                
                <div class="svg-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="none" d="M0 0h24v24H0z"></path>
                        <path fill="currentColor" d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"></path>
                    </svg>
                    
                </div>
            </div>
            <span>Enviar</span>
        </button>
    </div>
    
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        // Función para simular el efecto de máquina de escribir
        function typeWriter(text, element, delay = 100) {
            let index = 0;

            function type() {
                if (index < text.length) {
                    element.append(text.charAt(index));
                    index++;
                    setTimeout(type, delay);
                }
            }

            type();
        }

        // Evento para enviar el mensaje al hacer clic en el botón
        $("#send-btn").click(function() {
            var userMessage = $("#user-input").val();
            if (userMessage.trim() !== "") {
                // Agrega el mensaje del usuario al chat
                $("#chat-box").append("<div class='message user-message'><strong>Tú:</strong> " + userMessage + "</div>");
                $("#user-input").val("");

                // Enviar mensaje al servidor mediante POST
                $.post("/chat/", { message: userMessage }, function(data) {
                    $("#chat-box").append("<div class='message bot-message'><strong>Chatbot:</strong> </div>");
                    var botMessageElement = $("#chat-box").children().last();
                    setTimeout(function() {
                        // Efecto de máquina de escribir para la respuesta del bot
                        typeWriter(data.response, botMessageElement, 50);
                        // Desplazar el chat hacia abajo para mostrar el último mensaje
                        $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                    }, 1000); 
                }).fail(function() {
                    // Manejo de errores si falla la solicitud al servidor
                    $("#chat-box").append("<div class='message bot-message error'><strong>Chatbot:</strong> Hubo un error al procesar tu mensaje.</div>");
                });
            }
        });

        // Evento para enviar el mensaje al presionar Enter
        $("#user-input").keypress(function(e) {
            if (e.which == 13) {
                $("#send-btn").click();
            }
        });
    });
</script>
</body>
