{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes utilizadas -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'Inicio/style_inicioce.css'%}">
    <link rel="website icon" href="{% static 'icon_consola.png' %}" type="image/png">

    <!-- Nombre e icono de sitio web -->
    <title>Inicio ConsoleXpress</title>

    <style>
        /* Cuerpo de sitio inicio */
body {
    margin: 0;
    padding: 0;
    background-image: url("{% static 'fondo_ce_gradient01.png' %}");
    background-size: cover;
    height: 100vh; 
    display: flex;
    flex-direction: column;
    overflow-x: hidden; /* Previene que haya scroll horizontal si el contenido excede el ancho */
    min-height: 100vh; /* cubre el 100% pantalla */
    width: 100%; /* cubre 100% ancho de la pantalla */
    max-width: 100%; /* Evita que el contenido se extienda demas */
    height: 100%;
    
}
    </style>

</head>
<body>

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

        <!-- Encabezado -->
        <header>
            <div class="circle"></div>

            <div class="autenticacion">

                <a class="btn_login" href="{% url 'index_login' %}">Iniciar sesión</a> <!-- login -->
                <a class="btn_register" href="{% url 'index_register' %}">Registrar</a> <!-- register -->
            </div>
                
            <div class="icon_ConsoleXpress">
                <img src="{% static 'icono_ConsoleXpress.svg' %}" width="60px" height="60px">
            </div>

            <div class="line"></div>
               
        </header>

    

        <!-- Cuerpo de la pagina inicio -->
    <div class="main_inicio">
        <main>
            
            <div class="text_consoleXpress"> <h1>CONSOLEXPRESS</h1> </div>
            <div class="text_descripcion">  <h2>Somos tu tienda en línea especializada en consolas y accesorios. </h2>
            </div>

            <div>
                <!-- Boton explorar -->
                <a class="btn_explorar" href="{% url 'index_pant_prin' %}">Explorar       
                    <svg height="24" width="24" fill="#FFFFFF" viewBox="0 0 24 24" data-name="Layer 1" id="Layer_1" class="sparkle">
                    <path d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z"></path>
                </svg></a>
                
            </div>
            
            <!-- Categorias iconos -->
            <div class="categorias_inicio">
                <div class="catg1">
                    <p>Consolas</p>
                    <img src="{% static 'relleno_consola.png' %}" class="catg_cons">
                </div>

                <div class="catg2">
                    <p>Edición Especial</p>
                    <img src="{% static 'relleno_consola_esp.png' %}" class="catg_cons_esp" > 
                </div>

                <div class="catg3">
                    <p>Accesorios</p>
                    <img src="{% static 'relleno_accesorio_consola.png' %}" class="catg_cons_acc" >
                </div>

            </div>

        </main>

            <!-- Lado derecho de la pagina inicio -->
            <aside class="derecha_inicio">
                <div class="semicuadrado_rojo"> 

                    <div class="animation_console">
                        <div class="consola_img"> 
                            <img src="{% static 'consola_nintendo4k.png' %}" style="width: 580px;"> 
        
                                <div class="animation_sparkle">
                                    <img src="{% static 'sparkle.png' %}" alt="" class="star-1">
                                    <img src="{% static 'sparkle.png' %}" alt="" class="star-2">
                                </div>
                        </div> 

                    </div>
                </div>
            </aside>

         

    </div>

    <div class="line2"></div>   

    
</body>
</html>
