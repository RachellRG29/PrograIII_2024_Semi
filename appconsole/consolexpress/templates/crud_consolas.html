{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>
<body>

         <!-- Contenedor del formulario que aparece al hacer clic en "Consolas" -->
         <form class="frmAbrirConsola container-fluid d-none " id="formularioConsolasContainer" style="margin-top: 80px;">
            <div class="card" style="background: rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 0px; border: 1px solid rgba(255, 255, 255, 0.3); ">
                <div class="card-header" style="color: #333;">
                    <div class="d-flex justify-content-between align-items-center">
                        Consolas agregadas
                        <button type="button" class="btn-close btn-custom" aria-label="Close" onclick="cerrarFormulario()"></button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <!-- Botón para agregar una nueva consola -->
                        <button type="button" id="btnAgregarConsola" class="btn btnAgregar" data-bs-toggle="popover" title="Agregar Consola" data-bs-html="true">
                            Agregar consola 
                            <div class="icon">
                                <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><defs>
                                    <style>.cls-1{fill:none;stroke:#dc3e57;stroke-linecap:round;stroke-linejoin:round;stroke-width:2px;}</style></defs>
                                    <title/><g id="plus"><line class="cls-1" x1="16" x2="16" y1="7" y2="25"/>
                                    <line class="cls-1" x1="7" x2="25" y1="16" y2="16"/></g></svg>
                            </div>
                        </button>
        
                        <script>
                        //FORMULARIO ABRIR NUEVA CONSOLA DENTRO DEL CRUD_ADMI.HMTL
                        // Función para mostrar el popover
                        document.getElementById("btnAgregarConsola").addEventListener("click", function () {
                            document.getElementById("popoverConsola").style.display = "block";
                        });
        
                        // Función para cerrar el popover
                        function cerrarPopover() {
                            document.getElementById("popoverConsola").style.display = "none";
                        }
                        </script>
        
                        <!-- Caja de búsqueda -->
                        <div class="col-8">
                            <input type="text" id="searchConsola" class="form-control custom-input" placeholder="Buscar consolas" oninput="buscarConsolas()">
                        </div>
                    </div>

                <style>
                    /*SearchConsola*/
                    .custom-input {
                        background-color: rgba(255, 255, 255, 0.7)  !important; 
                        border: 1px solid rgba(220, 62, 87, 0.7) !important; 
                        backdrop-filter: blur(10px); 
                        color: black !important; 
                    }
                    .custom-input::placeholder {
                        color: rgba(0, 0, 0, 0.7) !important; 
                    }
                    
                    .custom-input:focus {
                        background-color: rgba(225, 255, 255, 0.9) !important; 
                        border-color: #dc3e57 !important; 
                        box-shadow: 0 0 0 0.2rem rgba(220, 62, 87, 0.4) !important; 
                    }
                </style>  
                    

                    <!-- TABLA DE LAS CONSOLAS AGREGADAS -->
                    <div class="table-responsive">
                        <table class="customTable" id="tblConsolas">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Imagen</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Presentación</th>
                                    <th>Categoría</th>
                                    <th>Marca</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th></th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="consolasBody">
                                <!-- Aquí irán las filas de consolas agregadas -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </form>
        
            <!-- Modal para Agregar Consola -->
            {% include 'consolas.html' %}
               

<!-- SCRIPT PRINCIPAL PARA EL FORMULARIO CONSOLAS (CRUD)-AGREGAR-EDITAR-ELIMINAR-ACTUALIZAR -->
<script>
    let dataConsolas=[];
    document.addEventListener("DOMContentLoaded", function () {
        cargarConsolas();
    });
    
    // Guardar consola (método POST)
    document.getElementById('formAgregarConsola').addEventListener('submit', function (event) {
        event.preventDefault();
    
        const formData = new FormData(this);
        const accion = this.dataset.accion; // 'modificar' o 'agregar'
        const idConsola = this.dataset.idconsola; // Solo estará definido si es 'editar'
    
        let url = "{% url 'guardar_consola' %}";
        formData.append('id', idConsola || ''); // Agregar el ID solo si existe
    
        //Validar inputs
        const codigo = document.querySelector('#codigo');
        const nombre = document.querySelector('#nombre');
        const descripcion = document.querySelector('#descripcion');
        const marca = document.querySelector('#marca');
        const precio = document.querySelector('#precio');
        const stock = document.querySelector('#stock');
        
        //validar los inputs
        const isCodigoValido = validarCodigo(codigo);
        const isNombreValido = validarNombre(nombre);
        const isDescripcionValido = validarDescripcion(descripcion);
        const isMarcaValido = validarMarca(marca);
        const isPrecioValido = validarPrecio(precio);
        const isStockValido = validarStock(stock);
        if(!isCodigoValido || !isNombreValido || !isDescripcionValido ||
            !isMarcaValido || !isPrecioValido || !isStockValido) {
            return; //detenemos envio hasta q los datos esten correctos :3
        }
        fetch(url, {
            method: 'POST',
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            if (data.msg === 'success') {
                if (accion === 'editar') {
                    const row = document.querySelector(`tr[data-id='${idConsola}']`);
                    row.innerHTML = 
                        `<td>${data.consola.codigo}</td>
                        <td><img src="${data.consola.imagen}" style="width: 90px;"></td>
                        <td>${data.consola.nombre}</td>
                        <td>${data.consola.descripcion}</td>
                        <td>${data.consola.presentacion}</td>
                        <td>${data.consola.categoria}</td>
                        <td>${data.consola.marca}</td>
                        <td>${data.consola.precio}</td>
                        <td>${data.consola.stock}</td>
                        <td>
                            <button class="btn btn-warning" type="button" onclick="editarConsola(${data.consola.id})"><i class="bi bi-pencil-square"></i></button>
                            <button class="btn btn-danger" type="button" onclick="eliminarConsola(${data.consola.id})"><i class="bi bi-trash3"></i></button>
                        </td>`;
                } else {
                    const tbody = document.getElementById("consolasBody");
                    const nuevaFila = tbody.insertRow();
                    nuevaFila.setAttribute('data-id', data.consola.id);
                    nuevaFila.innerHTML = 
                        `<td>${data.consola.codigo}</td>
                        <td><img src="${data.consola.imagen}" style="width: 90px;"></td>
                        <td>${data.consola.nombre}</td>
                        <td>${data.consola.descripcion}</td>
                        <td>${data.consola.presentacion}</td>
                        <td>${data.consola.categoria}</td>
                        <td>${data.consola.marca}</td>
                        <td>${data.consola.precio}</td>
                        <td>${data.consola.stock}</td>
                        <td>
                            <button class="btn btn-warning" type="button" onclick="editarConsola(${data.consola.id})"><i class="bi bi-pencil-square"></i></button>
                            <button class="btn btn-danger" type="button" onclick="eliminarConsola(${data.consola.id})"><i class="bi bi-trash3"></i></button>
                        </td>`;
                }
                cargarConsolas();
                limpiarConsolas();
    
                let mensaje = accion === 'editar' ? "Consola editada" : "Consola guardada";
    
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: "success",
                    title: mensaje, /*Mensaje de ambas partes*/
                    showConfirmButton: false,
                    timer: 3000
                });
                cerrarPopover();
            } else {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: "error",
                    title: "Error al guardar la consola",
                    showConfirmButton: false,
                    timer: 3000
                });
            }
        })
        .catch(error => {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: "error",
                title: "Error con la comunicación con el servidor",
                showConfirmButton: false,
                timer: 3000
            });
            console.error('Error:', error);
        });
    });
    
        // Cargar las consolas al inicio
        function cargarConsolas() {
            fetch("{% url 'consultar_consolas' %}")  // URL para obtener las consolas
                .then(response => response.json())
                .then(data => {
                    dataConsolas=data; //
                    const tbody = document.getElementById("consolasBody");
                    tbody.innerHTML = ''; // Limpia la tabla antes de llenarla
                    data.forEach(consola => {
                        const nuevaFila = tbody.insertRow();
                        nuevaFila.setAttribute('data-id', consola.id); // Agregar atributo data-id
                        nuevaFila.innerHTML = 
                            `<td>${consola.codigo}</td>
                            <td><img src="${consola.imagen}" style="width: 90px;"></td>
                            <td>${consola.nombre}</td>
                            <td>${consola.descripcion}</td>
                            <td>${consola.presentacion}</td>
                            <td>${consola.categoria}</td>
                            <td>${consola.marca}</td>
                            <td>${consola.precio}</td>
                            <td>${consola.stock}</td>
                            <td><button class="btn btn-warning" type="button" onclick="editarConsola(${consola.id})"><i class="bi bi-pencil-square"></i></button></td>
                            <td><button class="btn btn-danger" type="button" onclick="eliminarConsola(${consola.id})"><i class="bi bi-trash3"></i></button></td>
                        `;
                    });
                });
        }
    
        
        //Editar consolas
        function editarConsola(id) {
        fetch(`/consultar_consola_edit?id=${id}`) 
            .then(response => response.json())
            .then(data => {
                if (data.msg === 'error') {
                    Swal.fire('Error', data.error, 'error');
                    return;
                }
                // Rellenar formulario
                document.querySelector('input[name="codigo"]').value = data.codigo;
                document.querySelector('input[name="nombre"]').value = data.nombre;
                document.querySelector('textarea[name="descripcion"]').value = data.descripcion;
                document.querySelector('select[name="presentacion"]').value = data.presentacion;
                document.querySelector('select[name="categoria"]').value = data.categoria;
                document.querySelector('input[name="marca"]').value = data.marca;
                document.querySelector('input[name="precio"]').value = data.precio;
                document.querySelector('input[name="stock"]').value = data.stock;
                document.getElementById('consolaId').value = data.id;
    
                // Mostrar imagen si existe
                const imgElement = document.getElementById('imgPreview');
                imgElement.src = data.imagen ? data.imagen : '';
                imgElement.style.display = data.imagen ? 'block' : 'none';
    
                // Configurar formulario en modo edición
                const form = document.getElementById('formAgregarConsola');
                form.dataset.accion = 'editar';
                form.dataset.idconsola = id;
                document.getElementById('popoverTitle').innerText = 'Editar Consola';
                $('#popoverConsola').show();
            })
            .catch(error => console.error('Error al cargar los datos:', error));
    }
    
    function mostrarFilasConsolas(data = []){
            let filas = '';
            data.forEach(consola => {
                filas += 
                    `<td>${consola.codigo}</td>
                        <td><img src="${consola.imagen}" style="width: 90px;"></td>
                        <td>${consola.nombre}</td>
                        <td>${consola.descripcion}</td>
                        <td>${consola.presentacion}</td>
                        <td>${consola.categoria}</td>
                        <td>${consola.marca}</td>
                        <td>${consola.precio}</td>
                        <td>${consola.stock}</td>
                        <td><button class="btn btn-warning" type="button" onclick="editarConsola(${consola.id})"><i class="bi bi-pencil-square"></i></button></td>
                        <td><button class="btn btn-danger" type="button" onclick="eliminarConsola(${consola.id})"><i class="bi bi-trash3"></i></button></td>
                    `;
            });
            document.querySelector('#tblConsolas > tbody').innerHTML = filas;
        }
    
    //Buscar consolas
    function buscarConsolas() {
        const terminoBusqueda = document.getElementById("searchConsola").value.toLowerCase();
        const filas = document.querySelectorAll("#tblConsolas tbody tr");
        filas.forEach(fila => {
            const textoFila = fila.innerText.toLowerCase();
            fila.style.display = textoFila.includes(terminoBusqueda) ? "" : "none";
        });
    }
    
    //---ELIMINAR CON ALERTAR NO INVASIVAS----
    function eliminarConsola(id) {
        Swal.fire({
            title: "¿Estás seguro de eliminar esta consola?",
            text: "Recuerda que esto no es reversible",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "Sí, eliminar",
            cancelButtonText: "Cancelar"
        }).then((result) => {
            if (result.isConfirmed) { 
                fetch("{% url 'eliminar_consola' %}", {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken'),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: id }),
                })
                .then(response => {
                    if (response.ok) { 
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: "success",
                            title: "Consola eliminada con éxito",
                            showConfirmButton: false,
                            timer: 3000
                        });
                        cargarConsolas();
                        limpiarConsolas();
                    } else { 
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: "error",
                            title: "Error al eliminar la consola",
                            showConfirmButton: false,
                            timer: 3000
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: "error",
                        title: "Error en la comunicación con el servidor",
                        showConfirmButton: false,
                        timer: 3000
                    });
                    console.error("Error:", error);
                });
            } else { 
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: "info",
                    title: "Se canceló la eliminación",
                    showConfirmButton: false,
                    timer: 3000
                });
            }
        });
    }
    
    
     // Limpiar campos del formulario
     function limpiarConsolas() {
        document.getElementById('formAgregarConsola').reset();
        document.getElementById('formAgregarConsola').dataset.accion = 'agregar'; 
        delete document.getElementById('formAgregarConsola').dataset.idconsola; 
         
        
        // Limpiar la previsualización de la imagen
        const imgElement = document.getElementById('imgPreview');
        imgElement.src = '';
        imgElement.style.display = 'none'; // Ocultar la imagen
    }
    
    // Función para obtener el token CSRF
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Verifica si este es el cookie que estás buscando
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    
    </script>  
        
        
        
        <!-- Diseño de tabla, botones, Crud -->

                font-size: 1rem;

            /*Boton agregar*/

            font-size: 17px;
            font-weight: 500;

            border: none;
            letter-spacing: 0.05em;

            align-items: center;

            display: flex;

            transform: scale(0.95);

            /*Boton editar*/
            .btnEditar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid rgb(32, 32, 32);
            background-color: rgb(255, 222, 77);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.123);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            }
            .btnEditar::before {
            content: "";
            width: 200%;
            height: 200%;
            background-color: rgb(255, 178, 44);
            position: absolute;
            z-index: 1;
            transform: scale(0);
            transition: all 0.3s;
            border-radius: 50%;
            filter: blur(10px);
            }
        
            .btnEditar:hover::before {
            transform: scale(1);
            }
            .btnEditar:hover {
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.336);
            }
            .btnEditar svg {
            height: 17px;
            fill: #202020;
            z-index: 3;
            transition: all 0.2s;
            transform-origin: bottom;
            }
            .btnEditar:hover svg {
            transform: rotate(-15deg) translateX(5px);
            }
            .btnEditar::after {
            content: "";
            width: 20px;
            height: 1.5px;
            position: absolute;
            bottom: 9px; /*linea de trazo posicion*/
            left: -5px;
            background-color: rgb(32, 32, 32);
            border-radius: 2px;
            z-index: 2;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease-out;
            }
            .btnEditar:hover::after {
            transform: scaleX(1);
            left: 0px;
            transform-origin: right;
            }
           
        
            /* Boton eliminar*/

            }

            width: 15px;   
            }
            .bin-top {
            width: 17px;
            transform-origin: right;
            transition-duration: 0.3s;
            }

            transform: rotate(45deg);
            }
            .btnEliminar:hover {
            background-color: rgb(210, 19, 18);
            }
            .btnEliminar:active {
            transform: scale(0.9);

        </style>
    
</body>
