{% load static %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'Admin/style_consola.css' %}" type="text/css">

<!-- Popover personalizado para agregar consola -->
<div id="popoverConsola" class="card mb-3 popover-consola" >
    <div class="popover-header d-flex">
        <h5 id="popoverTitle">Agregar Consola</h5> 
        <button type="button" class="btn-close btnCloseConsola" onclick="cerrarPopover()">×</button>
    </div>
    <div class="card-body ">
        <form id="formAgregarConsola" method="post" enctype="multipart/form-data" action="{% url 'guardar_consola' %}">
            {% csrf_token %}
            <input type="hidden" id="consolaId" name="consolaId"> <!-- Campo oculto para el ID -->
            <div class="row">
                <!-- Columna Izquierda para la imagen -->
                <div class="col-4">
                    <div class="mb-3">
                        <label for="imagen">Imagen:</label>
                        <div class="image-preview" id="imagePreview">
                            <i class="upload-icon">📁</i>
                            <img id="imgPreview" src="" alt="Imagen seleccionada" class="img-fluid">
                        </div>
                        <input type="file" class="form-control" name="imagen" accept="image/*" onchange="previewImage(event)" required>
                    </div>
                </div>
                <!-- Columna Derecha para el resto de campos -->
                <div class="col-8">
                    <div class="mb-3 d-flex align-items-center"> <!-- CODIGO -->
                        <label for="codigo" class="col-form-label me-3">Código:</label>
                        <input type="text" class="form-control" id="codigo" name="codigo" onblur="validarCodigo(this)" required>
                    </div>
                    <div class="mb-3 d-flex align-items-center"> <!-- NOMBRE -->
                        <label for="nombre" class="col-form-label me-3">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" onblur="validarNombre(this)" required>
                    </div>
                    <div class="mb-3 d-flex align-items-center"> <!-- DESCRIPCION -->
                        <label for="descripcion" class="col-form-label me-3">Descripción:</label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="2" onblur="validarDescripcion(this)" required></textarea>
                    </div>
                    <div class="mb-3 d-flex align-items-center"><!-- PRESENTACION -->
                        <label for="presentacion" class="col-form-label me-3">Presentación:</label>
                        <select id="presentacion" name="presentacion" class="form-select" required>
                            <option value="Paquete completo">Paquete completo</option>
                            <option value="Individual">Individual</option>
                        </select>
                    </div>
                    <div class="mb-3 d-flex align-items-center"> <!-- CATEGORIA -->
                        <label for="categoria" class="col-form-label me-3">Categoría:</label>
                        <select id="categoria" name="categoria" class="form-select" required>
                            <option value="Consola">Consola</option>
                            <option value="Especial">Especial</option>
                            <option value="Accesorio">Accesorio</option>
                        </select>
                    </div>
                    <div class="mb-3 d-flex align-items-center"> <!-- MARCA -->
                        <label for="marca" class="col-form-label me-3">Marca:</label>
                        <input type="text" class="form-control" id="marca" name="marca" onblur="validarMarca(this)" required>
                    </div>
                    <div class="mb-3 d-flex align-items-center"> <!-- PRECIO -->
                        <label for="precio" class="col-form-label me-3">Precio:</label>
                        <input type="text" class="form-control" id="precio" name="precio" onblur="validarPrecio(this)" required>
                    </div>
                    <div class="mb-3 d-flex align-items-center"> <!-- STOCK -->
                        <label for="stock" class="col-form-label me-3">Stock:</label>
                        <input type="number" class="form-control" id="stock" name="stock" onblur="validarStock(this)" required>
                    </div>
                    <button type="reset" class="btnNuevo">Nuevo</button>
                    <button type="submit" class="btnGuardar">Guardar</button>     
                </div>
            </div>
        </form>
    </div>
</div>

<!-- VALIDACIONES DEL FORM AGREGAR Y EDITAR CONSOLAS -->
 <script>

// VALIDACION DE CODIGO
function validarCodigo(input) {
    const codigo = input.value.trim(); 
    const regexCodigo = /^[A-Za-z]{4}-\d{3}$/; // Formato: ABCD-123

    // Verificar si el campo está vacío
    if (codigo === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'El código no puede estar vacío.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    // Limitar la longitud a 8 caracteres
    if (codigo.length > 8) {
        input.value = codigo.slice(0, 8); // Limitar a los primeros 8 caracteres
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'info',
            title: 'El código no puede exceder 8 caracteres.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    // Verificar la longitud exacta y el formato del código
    if (codigo.length !== 8 || !regexCodigo.test(codigo)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'info',
            title: 'El código debe tener exactamente 8 caracteres en el formato ABCD-123.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    return true; // El código es válido
}

//---VALIDACION DE NOMBRE
function validarNombre(input) {
    const nombre = input.value.trim();
    const regexNombre = /[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/;

    // Verificar si el campo está vacío
    if (nombre === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'El nombre no puede estar vacío.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    if (regexNombre.test(nombre)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: "info",
            title: "Solo se permiten letras (incluyendo acentos y ñ) y espacios en el nombre",
            showConfirmButton: false,
            timer: 3000
        });
        // Elimina lo que no se permite
            input.value = nombre.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/g, '');
            return false;
    } return true;
                                                               
}

//VALIDACION DE DESCRIPCION
function validarDescripcion(input) {
    const descripcion= input.value.trim();
    const regexDescripcion = /[^A-Za-záéíóúÁÉÍÓÚñÑ\s-.:;,]/;

    // Verificar si el campo está vacío
    if (descripcion === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'La descripción no puede estar vacía.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    if (regexDescripcion.test(descripcion)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: "info",
            title: "Solo se permiten letras (acentos y ñ, guiones y puntos) en la descripción.",
            showConfirmButton: false,
            timer: 3000
        });
        // Elimina lo que no se permite
            input.value = descripcion.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s-.:;,]/g, '');
            return false;
    } return true;
                                                               
}

//VALIDACION DE MARCA
function validarMarca(input) {
    const marca = input.value.trim();
    const regexMarca = /[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/;

    // Verificar si el campo está vacío
    if (marca === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'La marca no puede estar vacía.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    if (regexMarca.test(marca)) {
        Swal.fire({
            toast: true,
            position: 'bottom-end',
            icon: "info",
            title: "Solo se permiten letras (incluyendo acentos y ñ) y espacios en la marca",
            showConfirmButton: false,
            timer: 3000
        });
        // Elimina lo que no se permite
            input.value = marca.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/g, '');
            return false;
    } return true;
                                                               
}


//VALIDACION DE PRECIO
function validarPrecio(input){
    const precio = input.value.trim(); 
    const regexPrecio = /^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$/; // Formato: entero o decimal con hasta 2 decimales

    // Verificar si el campo está vacío
    if (precio === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'El precio no puede estar vacío.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }
                        
    // Verificar si el precio es un número válido
    if (!regexPrecio.test(precio)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: "info",
            title: "El precio debe ser un número positivo y puede incluir hasta dos decimales.",
            showConfirmButton: false,
            timer: 3000
        });
        input.value = precio.replace(/[^0-9.]/g, ''); // Eliminar caracteres no válidos
        return false;
    }

    // Limitar a un máximo de 10 caracteres 
    if (precio.length > 10) {
        input.value = precio.slice(0, 10); // Limitar la longitud del precio a 10 caracteres
    }

    return true; 
}


//VALIDACION DE STOCK
function validarStock(input){
    const stock = input.value.trim();
    const regexStock = /^[0-9]+$/;

    // Verificar si el campo está vacío
    if (stock === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'El stock no puede estar vacío.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }
                        
    if(!regexStock.test(stock)){
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: "info",
            title: "Solo se permiten numeros",
            showConfirmButton: false,
            timer: 3000
        }); 
            input.value = stock.replace(/^[0-9]/g, '');
            return false; 
        }
    if(stock.length > 4){
        input.value = stock.slice(0, 4);      
    } return true;
}

 </script>



<!-- SCRIPT POPOVER CIERRE, ARRASTRABLE, VISUALIZACION IMAGEN ,Y CAMBIAR TITULO DEL POPOVER SEGUN ACCION -->
<script>
        $(document).ready(function() {
        // Hacemos el popoverConsola arrastrable
        $("#popoverConsola").draggable({ containment: "window" });

        // Cambiar el título del popover según la acción
        if (dataset.accion==='editar') {
            $("#popoverTitle").text("Editar Consola");
            $("button[type='submit']").text("Editar"); 
        } else {
            $("#popoverTitle").text("Agregar Consola");
            $("button[type='submit']").text("Guardar");
        }
    });

    // Función para cerrar el popover
    function cerrarPopover() {
        document.getElementById("popoverConsola").style.display = "none";
    }

    function previewImage(event) {
    const imagePreview = document.getElementById('imagePreview');
    const imgElement = document.getElementById('imgPreview');
    const file = event.target.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            imgElement.src = e.target.result;
            imgElement.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        imgElement.src = '';
        imgElement.style.display = 'none';
    }
}

</script>
