<!-- Menú Deslizable de Compra -->
<div id="cartMenu" class="cart-menu">
    <div class="cart-menu-header">
        <!-- Botón de cerrar menú de compra -->
        <button id="closeCartMenu" class="close-cart">
            <span class="X">X</span>
        </button>
        <h5 class="cart-title">Carrito de Compras</h5>
        <button type="button" class="limpiar-carrito" onclick="limpiarCarrito()">
            <span class="limpiar-carrito__text">Vaciar Carrito</span>
            <span class="limpiar-carrito__icon">
              <svg class="svg" height="48" viewBox="0 0 48 48" width="48" xmlns="http://www.w3.org/2000/svg">
                <path d="M35.3 12.7c-2.89-2.9-6.88-4.7-11.3-4.7-8.84 0-15.98 7.16-15.98 16s7.14 16 15.98 16c7.45 0 13.69-5.1 15.46-12h-4.16c-1.65 4.66-6.07 8-11.3 8-6.63 0-12-5.37-12-12s5.37-12 12-12c3.31 0 6.28 1.38 8.45 3.55l-6.45 6.45h14v-14l-4.7 4.7z"></path>
                <path d="M0 0h48v48h-48z" fill="none"></path>
              </svg>
            </span>
          </button> 
    </div>
    <div class="cart-menu-body">
        <!-- Contenido del carrito (productos añadidos) -->
    </div>
    <div class="cart-menu-footer">
        <div class="labels-container">
            <label for="compramenu" class="compramenu">TOTAL</label>
            <label for="TOTALCOMPRA" class="total-compra">0.00 $</label>
        </div>
        <button type="button" class="btn-checkout">
            Comprar
            <i class="bi bi-cart-plus-fill"></i>
        </button>
    </div>
</div>


<script>
    // Variables del menú y botones
    const cartMenu = document.getElementById('cartMenu');
    const openCartButton = document.getElementById('openCartButton');
    const closeCartMenu = document.getElementById('closeCartMenu');
    const cartItems = document.getElementById('cartItems');
    const cartBody = document.querySelector('.cart-menu-body');
    const totalCompraLabel = document.querySelector('.total-compra');
    
    // Inicializa el carrito
    let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
    
    // Función para abrir el menú del carrito
    function abrirCarrito() {
        cartMenu.classList.add('show');
        actualizarCarrito();
    }

    // Función para cerrar el menú del carrito
    closeCartMenu.addEventListener('click', () => {
        cartMenu.classList.remove('show');
    });
    
    // Función para agregar al carrito
    const addToCartButton = document.getElementById("addToCartButton");
    addToCartButton.addEventListener("click", function() {
        const producto = {
            nombre: "{{ producto.nombre }}", 
            precio: parseFloat(document.getElementById("productPrice").innerText), 
            imagen: "{{ producto.imagen.url }}",  // Usar .url para la imagen
            cantidad: 1,
            codigo: "{{ producto.codigo }}"  // Asegúrate de agregar un código único
        };

        // Verificar si el producto ya está en el carrito
        const productoExistente = carrito.find(item => item.codigo === producto.codigo);

        if (productoExistente) {
            // Si el producto ya está en el carrito, solo aumentamos la cantidad
            productoExistente.cantidad++;
        } else {
            // Si no, lo agregamos al carrito
            carrito.push(producto);
        }

        // Guardar el carrito en localStorage
        localStorage.setItem('carrito', JSON.stringify(carrito));

        // Actualizamos la vista del carrito
        actualizarCarrito();
    });

    // Función para actualizar el carrito visualmente
    function actualizarCarrito() {
        cartBody.innerHTML = ''; // Limpia el contenido actual del carrito
        let total = 0;

        carrito.forEach(producto => {
    total += producto.precio * producto.cantidad;
    const cartItem = document.createElement('div');
    cartItem.classList.add('cart-item');
    cartItem.innerHTML = `
    <img src="${producto.imagen}" alt="${producto.nombre}" class="cart-item-img">
    <div class="cart-item-info">
        <h5>${producto.nombre}</h5>
        <p>${producto.precio} $</p>
        <div class="quantity-control">
            <button onclick="decrementarCantidad('${producto.codigo}')">-</button>
            <span class="quantity">${producto.cantidad}</span>
            <button onclick="incrementarCantidad('${producto.codigo}')">+</button>
        </div>
    </div>
    <button class="remove-btn" onclick="eliminarProducto('${producto.codigo}')">
        <svg viewBox="0 0 448 512" class="svgIcon">
            <path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"></path>
        </svg>
    </button>
</div>

    `;
            cartBody.appendChild(cartItem);
        });

        totalCompraLabel.textContent = `${total.toFixed(2)} $`;
    }

    // Incrementar cantidad
    function incrementarCantidad(codigo) {
        const producto = carrito.find(item => item.codigo === codigo);
        if (producto) {
            producto.cantidad++;
            localStorage.setItem('carrito', JSON.stringify(carrito));
            actualizarCarrito();
        }
    }

    // Decrementar cantidad
    function decrementarCantidad(codigo) {
        const producto = carrito.find(item => item.codigo === codigo);
        if (producto && producto.cantidad > 1) {
            producto.cantidad--;
            localStorage.setItem('carrito', JSON.stringify(carrito));
            actualizarCarrito();
        }
    }

    // Eliminar producto del carrito
    function eliminarProducto(codigo) {
        carrito = carrito.filter(item => item.codigo !== codigo);
        localStorage.setItem('carrito', JSON.stringify(carrito));
        actualizarCarrito();
    }

    // Asignar el evento al botón para abrir el carrito
    openCartButton.addEventListener('click', abrirCarrito);

    // Actualizar el carrito al cargar la página
    actualizarCarrito();

        } else {
            alert("Tu carrito está vacío.");
        }

*/
    
    // Evento para redirigir al usuario a la página de pago
    const btnCheckout = document.querySelector('.btn-checkout');

    btnCheckout.addEventListener('click', function() {
        if (carrito.length > 0) {
            window.location.href = '/pago/';  // Redirige a la página de pago
        } else {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'error',
                title: 'Tu carrito está vacío.',
                showConfirmButton: false,
                timer: 3000
            });
        }
    });



// Evento para "Comprar ahora"
    const buyNowButton = document.getElementById("buyNowButton");
    buyNowButton.addEventListener("click", function() {
        window.location.href = '/pago/';  // Redirige directamente a la página de pago
    });

    actualizarCarrito();
</script>

    
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="message {{ message.tags }}">
                    {{ message }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
    
    <script>
        // Limpiar el carrito si se realiza el pago con éxito
        if (window.localStorage) {
            let carrito = localStorage.getItem('carrito');
            if (carrito && document.location.pathname === "/") {
                // El carrito se limpia
                localStorage.removeItem('carrito');
            }
        }
    </script>



    <script>
            // Limpiar el carrito completo
    function limpiarCarrito() {
        // Vaciar el carrito
        carrito = [];

        // Limpiar el localStorage
        localStorage.setItem('carrito', JSON.stringify(carrito));

        // Actualizar la UI del carrito
        actualizarCarrito();
    }

    // Eliminar producto del carrito
    function eliminarProducto(codigo) {
        // Filtramos los productos que no tienen el código que se quiere eliminar
        carrito = carrito.filter(item => item.codigo !== codigo);

        // Actualizamos el carrito en el localStorage
        localStorage.setItem('carrito', JSON.stringify(carrito));

        // Actualizamos la UI del carrito (limpiamos y volvemos a mostrar los productos)
        actualizarCarrito();
    }
    </script>
