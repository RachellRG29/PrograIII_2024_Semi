{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="sweetalert2.min.css">

    <!-- Fuentes utilizadas -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="{% static 'Admin/style_crud.css' %}">
    <link rel="website icon" href="{% static 'icon_consola.png' %}" type="image/png">

    

    <title>Crud ConsoleXpress</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'fondo_cinematico_nintendo.png' %}");
            background-size: cover;
            height: 100vh; 
        }
    </style>

</head>
<body>
    <!-- Header- Navbar: Logo, perfil Admin y logout -->
    <header>
        <nav class="navbar">

        <div class="logo">
            <!-- Logo de ConsoleXpress -->
            <img alt="ConsoleXpress Logo" height="50" src="{% static 'icono_ConsoleXpress.svg' %}" width="40"/>
            <span>ConsoleXpress</span>
        </div>    

        <ul class="nav-links">
            <li><a href="">Consolas</a></li>
            <li><a href="">Categorias</a></li>
            <li><a href="">Compra</a></li>
           
        </ul>

        <div class="user_admin">
            <span id="lblUserAdmin" style="color: white;">Usuario</span>
            
            <button class="btn_user_img" onclick="toggleUserMenu()">
                <img src="{% static 'icon_user.svg' %}" alt="" width="28px">
            </button>

            <!-- Menú desplegable de usuario -->
            <div id="user-menu" class="user-menu">
                <button class="btn_logout">
                    <img src="{% static 'icon_logout_door.svg' %}" alt="" width="20px"> Logout
                </button>
            </div>
        </div>

        </nav>
    </header>


    <section class="p-3">
        <div class="row justify-content-center">
            <div class="col-12 d-flex align-items-center">
                <!-- Botón para agregar una nueva consola -->
                <button type="button" id="btnAgregarConsola" class="btn btn-danger btn-outline-warning me-5 gap-2 col-2" data-bs-toggle="popover" title="Agregar Consola" data-bs-html="true">
                    Agregar consola <i class="bi bi-plus-lg"></i>
                </button>
                 <!-- script que permite abrir el boton de agregar con el formulario -->
                  <script>
                    // Función para mostrar el popover
                    document.getElementById("btnAgregarConsola").addEventListener("click", function () {
                        document.getElementById("popoverConsola").style.display = "block";
                    });

                    // Función para cerrar el popover
                    function cerrarPopover() {
                        document.getElementById("popoverConsola").style.display = "none";
                    }
                  </script>
                
                <!-- Caja de busqueda -->
                <div class="col-8">
                    <input type="text" id="searchConsola" class="form-control" placeholder="Buscar consolas" oninput="buscarConsolas()">
                </div>
            </div>

            <!-- TABLA DE LAS CONSOLAS AGREGADAS -->
            <div class="row">
                <div class="col-12 center">
                    <table class="table table-dark table-hover mt-4 text-center border border-danger-subtle" id="tblConsolas">
                        <thead>
                            <tr>
                                <th>Codigo</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Descripcion</th>
                                <th>Categoria</th>
                                <th>Marca</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody  id="consolasBody">

                        </tbody>
                        
                    </table>
                </div>

            </div>

        </div>
    </section>

        <!-- Modal para Agregar Consola -->
        {% include 'consolas.html' %}
       
        <script>

        document.addEventListener("DOMContentLoaded", function(){
            cargarConsolas();
        });

        //Guardar consola metodo post
        document.getElementById('formAgregarConsola').addEventListener('submit', function (event) {
            event.preventDefault(); // Previene el envio default

            const formData = new FormData(this); 

            fetch("{% url 'guardar_consola' %}", {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.msg === 'success') {
                    // Agregar la nueva consola a la tabla
                    const tbody = document.getElementById("consolasBody");
                    const nuevaFila = tbody.insertRow();
                    nuevaFila.innerHTML = `
                        <td>${data.consola.codigo}</td>
                        <td><img src="${data.consola.imagen}" style="width: 90px;"></td>
                        <td>${data.consola.nombre}</td>
                        <td>${data.consola.descripcion}</td>
                        <td>${data.consola.categoria}</td>
                        <td>${data.consola.marca}</td>
                        <td>${data.consola.precio}</td>
                        <td>${data.consola.stock}</td>
                        <td>
                            <button class="btn btn-warning" onclick="editarConsola(${data.consola.id})"><i class="bi bi-pencil-square"></i></button>
                            <button class="btn btn-danger" onclick="eliminarConsola(${data.consola.id})"><i class="bi bi-trash3"></i></button>
                        </td>`;
                    cargarConsolas();
                    //Mensaje de exito de consola guardada
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: "success",
                        title: "Consola guardada",
                        showConfirmButton: false,
                        timer: 3000
                    });
                    
                    cerrarPopover(); // Cerrar el popover
                } else {
                    //Mensaje de error al guardar consola
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: "error",
                        title: "Error al guardar la consola",
                        showConfirmButton: false,
                        timer: 3000
                    });
                }
            })
            .catch(error => {
                //Mensaje de error con el servidor
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: "error",
                    title: "Error con la comunicacion con el servidor",
                    showConfirmButton: false,
                    timer: 3000
                });
                console.error('Error:', error);
            });
        });


        // Cargar las consolas al inicio
            function cargarConsolas() {
                fetch("{% url 'consultar_consolas' %}")  // URL para obtener las consolas
                    .then(response => response.json())
                    .then(data => {
                        const tbody = document.getElementById("consolasBody");
                        tbody.innerHTML = ''; // Limpiar la tabla antes de llenarla
                        data.forEach(consola => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${consola.codigo}</td>
                                    <td><img src="${consola.imagen}" style="width: 90px;"></td> 
                                    <td>${consola.nombre}</td>
                                    <td>${consola.descripcion}</td>
                                    <td>${consola.categoria}</td>
                                    <td>${consola.marca}</td>
                                    <td>${consola.precio}</td>
                                    <td>${consola.stock}</td>
                                    <td><button class="btn btn-warning" onclick="editarConsola(${consola.id})"><i class="bi bi-pencil-square"></i></button></td>
                                    <td><button class="btn btn-danger" onclick="eliminarConsola(${consola.id})"><i class="bi bi-trash3"></i></button></td>
                                    
                                </tr>
                            `;
                        });
                    });
            }    



    // Función para abrir el form y editar sus datos :3
    function editarConsola(id) {
    // Cargar datos de la consola
    fetch(`consultar_consolas/${id}/`)
        .then(response => response.json())
        .then(consola => {
            // Rellenar los campos del modal con los datos obtenidos
            document.getElementById("editConsolaId").value = consola.id;
            document.getElementById("editCodigo").value = consola.codigo;
            document.getElementById("editNombre").value = consola.nombre;
            // Completa los demás campos según tu formulario
            
            // Mostrar el modal de edición
            const modal = new bootstrap.Modal(document.getElementById("modalEditarConsola"));
            modal.show();
        });
}

// Escuchar el envío del formulario de edición
document.getElementById('formAgregarConsola').addEventListener('submit', function (event) {
    event.preventDefault(); // Prevenir el envío por defecto

    // Obtener datos del formulario
    const consolaId = document.getElementById("consolaId").value;
    const data = {
        codigo: document.getElementById("editCodigo").value,
        nombre: document.getElementById("editNombre").value,
        // Completa con los demás datos de la consola
    };

    // Realizar la solicitud PUT
    fetch(`consultar_consolas/${consolaId}/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data),
    })
    .then(response => response.json())
    .then(data => {
        if (data.msg === 'success') {
            alertify.success('Consola editada exitosamente');
            cargarConsolas(); // Recargar la tabla
            // Cerrar el modal de edición
            const modal = bootstrap.Modal.getInstance(document.getElementById("popoverConsola"));
            modal.hide();
        } else {
            alertify.error('Error al editar la consola');
        }
    })
    .catch(error => console.error('Error:', error));
});

// Función para cerrar el popover
function cerrarPopover() {
    document.getElementById("popoverConsola").style.display = "none"; // Ocultar el popover
}


//---ELIMINAR CON ALERTAR NO INVASIVAS----
function eliminarConsola(id) {
    Swal.fire({
        title: "¿Estás seguro de eliminar esta consola?",
        text: "Recuerda que esto no es reversible",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#3085d6",
        cancelButtonColor: "#d33",
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar"
    }).then((result) => {
        if (result.isConfirmed) { 
            fetch("{% url 'eliminar_consola' %}", {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken'),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id }),
            })
            .then(response => {
                if (response.ok) { 
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: "success",
                        title: "Consola eliminada con éxito",
                        showConfirmButton: false,
                        timer: 3000
                    });
                    cargarConsolas();
                } else { 
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: "error",
                        title: "Error al eliminar la consola",
                        showConfirmButton: false,
                        timer: 3000
                    });
                }
            })
            .catch(error => {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: "error",
                    title: "Error en la comunicación con el servidor",
                    showConfirmButton: false,
                    timer: 3000
                });
                console.error("Error:", error);
            });
        } else { 
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: "info",
                title: "Se canceló la eliminación",
                showConfirmButton: false,
                timer: 3000
            });
        }
    });
}



// Función para obtener el token CSRF (puedes agregar esto al final de tu script)
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            // Verifica si este es el cookie que estás buscando
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

            
        </script>

    <!-- Script de navbar - menu-logout -->
    <script>
        function toggleUserMenu() {
            const userMenu = document.getElementById("user-menu");
            userMenu.style.display = userMenu.style.display === "none" || userMenu.style.display === "" ? "block" : "none";
        }
        
        // Cerrar el menú al hacer clic fuera de él
        window.onclick = function(event) {
            const userMenu = document.getElementById("user-menu");
            if (!event.target.closest('.btn_user_img') && !event.target.closest('.user-menu')) {
                userMenu.style.display = "none";
            }
        };
        </script>
        
        
    <!-- Script del sweetalert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
