<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes utilizadas -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'Admin/style_crud.css' %}">
    <link rel="website icon" href="{% static 'icon_consola.png' %}" type="image/png">

    <title>Crud ConsoleXpress</title>
</head>
<body>
    <!-- Header: Logo, barra de búsqueda y perfil Admin -->
    <header>
        <div class="logo">
            <!-- Logo de ConsoleXpress -->
            <img alt="ConsoleXpress Logo" height="50" src="{% static 'icono_ConsoleXpress.svg' %}" width="40"/>
            <span>ConsoleXpress</span>
        </div>

        <div class="admin">
            <!-- Sección Admin -->
            <span id="lblAdmin" style="color: white;">Usuario</span>
            <i class="fas fa-user" style="color: white;"></i>
        </div>

        <div class="logout">
            <button class="border border-danger-subtle" id="btn_logout" style="margin-right: 15px;">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>

    </header>


    <section class="p-3">
        <div class="row">
            <div class="col-12 d-flex align-items-center">
                <!-- Botón para agregar una nueva consola -->
                <button class="btn btn-danger btn-outline-warning me-5 gap-2 col-2" data-bs-toggle="modal" data-bs-target="#formCrud">
                    Agregar <i class="bi bi-plus-lg"></i>
                </button>
                 <!-- script que permite abrir el boton de agregar con el formulario -->
                <script>
                document.addEventListener('DOMContentLoaded', event => {
                    mnxAgregar.addEventListener('click', e => {
                        e.preventDefault();
                        let form = e.target.dataset.form;
                        abrirVentana(form);
                    });
                });

                function abrirVentana(form) {
                    let $element = $(`#${form}`);
                    if( $element.find("form").length > 0) {
                        $element.show();
                    } else {
                        let url = `/consolas/${form}`;
                        fetch(url).then(resp=>resp.text()).then(vista => {
                            $(`#${form}`).html(vista).draggable();
                            cerrarVentana();
                        });
                    }
                }


                </script>
                
                <!-- Caja de busqueda -->
                <div class="col-8">
                    <input type="text" id="searchConsola" class="form-control" placeholder="Buscar consolas" oninput="buscarConsolas()">
                </div>
            </div>

            <!-- TABLA DE LAS CONSOLAS AGREGADAS -->
            <div class="row">
                <div class="col-12">
                    <table class="table table-dark table-hover mt-4 text-center border border-danger-subtle" id="tblConsolas">
                        <thead>
                            <tr>
                                <th>Codigo</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Descripcion</th>
                                <th>Categoria</th>
                                <th>Marca</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th></th>
                            </tr>
                        </thead>
                        
                    </table>
                </div>

            </div>

        </div>
    </section>


    <script>
        function eliminarConsola(idConsola){
            if(confirm("¿Desea eliminar este registro?")){
                let datos = {
                    accion : "eliminar",
                    idConsola,
                };
                enviarDatosConsola(datos);
            }
        }
        function consultarConsola(){
            fetch('consultar_consolas/')
            .then(res => res.json())
            .then(data => {
                mostrarFilasConsolas(data);
            })
            .catch(err => console.log(err));
        }
        function mostrarFilasConsolas(data = []){
            let filas = '';
            data.forEach(consola => {
                filas += `
                    <tr onClick='modificarConsola(${JSON.stringify(consola)})'>
                        <td>${consola.codigo}</td>
                        <td>${consola.nombre}</td>
                        <td>${consola.direccion}</td>
                        <td>${consola.telefono}</td>
                        <td>
                            <button type="button" class="btn btn-outline-danger" 
                                onClick='eliminarConsola(${consola.id})'>DEL
                            </button>
                        </td>
                    </tr>
                `;
            });
            document.querySelector('#tblConsola > tbody').innerHTML = filas;
        }
        consultarAlumnos();
    </script>

</body>
</html>
