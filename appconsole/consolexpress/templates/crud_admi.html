{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!--<link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bulma@4/bulma.css" rel="stylesheet"> -->

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Fuentes utilizadas -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="{% static 'Admin/style_crud.css' %}">
    <link rel="website icon" href="{% static 'icon_consola.png' %}" type="image/png">

    <title>Crud ConsoleXpress</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'img_fondoCrud4k.jpeg' %}");
            background-size: cover;
            height: 100vh; 
        }
    </style>

</head>
<body>
    <!-- Header- Navbar: Logo, perfil Admin y logout -->
    <header> 
        <nav class="navbar">
            <div class="container-fluid">
                <div class="logo d-flex align-items-center">
                    <!-- Logo de ConsoleXpress -->
                    <img alt="ConsoleXpress Logo" height="50" style="filter: invert();" src="{% static 'icono_ConsoleXpress.svg '%}" width="40"/>
                    <span class="text-white ms-2">ConsoleXpress</span>
                </div>  

                <ul class="nav-links ms-auto d-flex flex-row">
                    <li class="nav-item"><a href="#" id="linkConsolas" class="nav-link text-white">Consolas</a></li>
                    <li class="nav-item"><a href="#" id="linkCompras" class="nav-link text-white">Compra</a></li>
                    <li class="nav-item"><a href="#" id="linkClientes" class="nav-link text-white" >Clientes</a></li>
                </ul>

                <div class="user_admin">
                    <span id="lblUserAdmin" style="color: white;">Usuario</span>
                    
                    <button class="btn_user_img" onclick="toggleUserMenu()">
                        <svg width="28px" height="28px" class="user-icon" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                            <rect fill="none" height="256" width="256"/>
                            <circle cx="128" cy="120" r="44"/>
                            <path d="M128,24A104,104,0,1,0,232,128,104.2,104.2,0,0,0,128,24Zm65.8,162.4a81.3,81.3,0,0,0-24.5-23,59.7,59.7,0,0,1-82.6,0,81.3,81.3,0,0,0-24.5,23,88,88,0,1,1,131.6,0Z"/>
                        </svg>
                    </button>
        
                    <!-- Menú desplegable de usuario -->
                    <div id="user-menu" class="user-menu">
                        <button class="btn_logout">
                            <img src="{% static 'icon_logout_door.svg' %}" alt="" width="20px"> Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <!-- MODAL PARA AGREGAR EL CRUD CONSOLAS -->
    <!-- permite poner el formulario crud de las consolas  -->
    {% include 'crud_consolas.html' %}


              

    <!-- Script de navbar - menu- CONSOLAS -->
    <script>
        // Función para mostrar el formulario
        document.getElementById("linkConsolas").addEventListener("click", function(event) {
            event.preventDefault(); // Evita la redirección de enlace
            document.getElementById("formularioConsolasContainer").classList.remove("d-none");
        });

        // Función para cerrar el formulario
        function cerrarFormulario() {
            document.getElementById("formularioConsolasContainer").classList.add("d-none");
        }

    </script>

    <!-- Script de navbar - menu-logout -->
    <script>
        function toggleUserMenu() {
            const userMenu = document.getElementById("user-menu");
            userMenu.style.display = userMenu.style.display === "none" || userMenu.style.display === "" ? "block" : "none";
        }
        
        // Cerrar el menú al hacer clic fuera de él
        window.onclick = function(event) {
            const userMenu = document.getElementById("user-menu");
            if (!event.target.closest('.btn_user_img') && !event.target.closest('.user-menu')) {
                userMenu.style.display = "none";
            }
        };
    </script>
        
    

</body>
</html>
