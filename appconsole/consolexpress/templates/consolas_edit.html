<!-- Modal para editar consola (puedes agregar este formulario dentro de tu modal existente o como uno nuevo) -->
<div id="popoverEditar" class="popover" style="display:none;">
    <form id="formEditarConsola">
        <input type="hidden" id="editarConsolaId">
        <div class="mb-3">
            <label for="editarCodigo" class="form-label">Código</label>
            <input type="text" class="form-control" id="editarCodigo" required>
        </div>
        <div class="mb-3">
            <label for="editarNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="editarNombre" required>
        </div>
        <!-- Agrega aquí los demás campos necesarios para editar -->
        <button type="submit" class="btn btn-success">Guardar Cambios</button>
        <button type="button" class="btn btn-secondary" onclick="cerrarPopover()">Cancelar</button>
    </form>
</div>

<script>
    function editarConsola(id) {
        // Función para cargar los datos de la consola seleccionada en el formulario de edición
        fetch(`/consultar_consola/${id}/`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('editarConsolaId').value = data.id;
                document.getElementById('editarCodigo').value = data.codigo;
                document.getElementById('editarNombre').value = data.nombre;
                // Completa los demás campos según sea necesario
                document.getElementById("popoverEditar").style.display = "block"; // Mostrar el popover de edición
            });
    }

    document.getElementById('formEditarConsola').addEventListener('submit', function (event) {
        event.preventDefault(); // Prevenir el envío por defecto del formulario
        const formData = new FormData(this);

        fetch(`/editar_consola/${document.getElementById('editarConsolaId').value}/`, {
            method: 'PUT',
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            if (data.msg === 'success') {
                alertify.success('¡Consola editada exitosamente!'); // Mensaje de éxito
                cargarConsolas(); // Recargar la tabla
                cerrarPopover(); // Cerrar el popover
            } else {
                alertify.error('Error al editar la consola.'); // Mensaje de error
            }
        })
        .catch(error => {
            alertify.error('Error en la comunicación con el servidor.'); // Mensaje de error
            console.error('Error:', error);
        });
    });

    function eliminarConsola(id) {
        fetch(`/eliminar_consola/${id}/`, {
            method: 'DELETE',
        })
        .then(response => response.json())
        .then(data => {
            if (data.msg === 'success') {
                alertify.success('¡Consola eliminada exitosamente!'); // Mensaje de éxito
                cargarConsolas(); // Recargar la tabla
            } else {
                alertify.error('Error al eliminar la consola.'); // Mensaje de error
            }
        })
        .catch(error => {
            alertify.error('Error en la comunicación con el servidor.'); // Mensaje de error
            console.error('Error:', error);
        });
    }
</script>
