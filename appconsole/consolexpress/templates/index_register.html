            <!-- VISUALIZAR CONTRASEÑA CON ICONO -->
            <script>
              // Selecciona el campo de contraseña y el ícono de alternar
              const passwordInput = document.getElementById('passwordInput');
              const togglePassword = document.getElementById('togglePassword');
              const toggleIcon = document.getElementById('toggleIcon');
          
              // Función para alternar la visibilidad de la contraseña
              togglePassword.addEventListener('click', () => {
                  if (passwordInput.type === 'password') {
                      passwordInput.type = 'text';
                      toggleIcon.classList.remove('bi-eye-fill');
                      toggleIcon.classList.add('bi-eye-slash-fill');
                  } else {
                      passwordInput.type = 'password';
                      toggleIcon.classList.remove('bi-eye-slash-fill');
                      toggleIcon.classList.add('bi-eye-fill');
                  }
              });

    <!-- VALIDACION DE INPUTS DEL FORMULARIO REGISTER -->
<script>
function handleRegister() {
    const usuarioInput = document.querySelector('input[name="username"]');
    const emailInput = document.querySelector('input[name="email"]');
    const passwordInput = document.querySelector('input[name="password"]');
    const confirmpasswordInput = document.querySelector('input[name="confirm_password"]');

    const isUsuarioValido = validarUsuario(usuarioInput);
    const isEmailValido = validarEmail(emailInput);
    const isPasswordValido = validarPassword(passwordInput);
    const isConfirmPasswordValido = validarConfirmPassword(confirmpasswordInput)

    // Si alguna validación falla, se cancela el envío
    if (!isUsuarioValido || !isEmailValido || !isPasswordValido || !isConfirmPasswordValido) {
        return false;
    }

    return true; // Permitir el envío si todo es válido
}


//---VALIDACION DE NOMBRE DE USUARIO
function validarUsuario(input) {
    const usuarioRegister = input.value.trim();
    const regexUsuarioRegister = /^[A-Za-z0-9\s]+$/; // Solo letras, números y espacios
    const soloNumeros = /^[0-9\s]+$/;    // Solo números

    // Verificar si el campo está vacío
    if (usuarioRegister === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'El nombre de usuario no puede estar vacío.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    if (soloNumeros.test(usuarioRegister)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: "info",
            title: "El nombre de usuario no puede contener solo números.",
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    // Si contiene caracteres no permitidos
    if (!regexUsuarioRegister.test(usuarioRegister)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: "info",
            title: "Solo se permiten letras, números y espacios en el nombre de usuario.",
            showConfirmButton: false,
            timer: 3000
        });
        // Elimina lo que no se permite
        input.value = usuarioRegister.replace(/[^A-Za-z0-9\s]/g, '');  // Elimina cualquier cosa que no sea letra, número o espacio
        return false;
    }

    return true;  // Si pasa la validación
}

function validarEmail(input) {
  const emailRegister = input.value.trim();
  const regexEmailRegister = /^[a-zA-Z0-9._-]+@gmail\.com$/;

    if (emailRegister === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'El correo no puede estar vacío.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    if (!regexEmailRegister.test(emailRegister)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'info',
            title: 'El correo electrónico no es válido.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    return true;
}

//---VALIDACION DE CONTRASEÑA
function validarPassword(input) {
    const password = input.value.trim();

    // Expresión regular para contraseña segura (al menos una letra, un número y un carácter especial).
    const regexPassword = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+={}\[\]:;"'<>?,./\\|-])[A-Za-z\d!@#$%^&*()_+={}\[\]:;"'<>?,./\\|-]{6,15}$/;

    // Limpiar posibles mensajes de error anteriores
    limpiarMensajeError(input);

    // Validación: Contraseña vacía
    if (password === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'La contraseña no puede estar vacía.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    // Validación: Espacios en la contraseña
    if (/\s/.test(password)) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'La contraseña no puede contener espacios.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    // Validación: Contraseña demasiado corta
    if (password.length < 6) {
        mostrarErrorDebajo(input, 'Contraseña demasiado corta e insegura.');
        return false;
    }

    // Validación: Contraseña demasiado larga
    if (password.length > 15) {
        mostrarErrorDebajo(input, 'La contraseña no puede exceder los 15 caracteres.');
        return false;
    }

    // Validación: Contraseña insegura (solo letras o solo números)
    if (/^[A-Za-z]+$/.test(password) || /^\d+$/.test(password)) {
        mostrarErrorDebajo(input, 'Contraseña insegura. Use letras, números y caracteres especiales.');
        return false;
    }

    // Validación: Contraseña cumple todos los requisitos
    if (!regexPassword.test(password)) {
        mostrarErrorDebajo(input, 'Debe contener al menos una letra, un número y un carácter especial.');
        return false;
    }

    return true; // Si pasa todas las validaciones
}

//---Mostrar mensaje de error debajo del input
function mostrarErrorDebajo(input, mensaje) {
    const errorSpan = document.createElement('span');
    errorSpan.classList.add('error-message');
    errorSpan.textContent = mensaje;

    const parent = input.parentNode;
    parent.appendChild(errorSpan);
}

//---Limpiar mensajes de error previos
function limpiarMensajeError(input) {
    const parent = input.parentNode;
    const errorSpan = parent.querySelector('.error-message');
    if (errorSpan) {
        errorSpan.remove();
    }
}
//---VALIDACION DE CONFIRMAR CONTRASEÑA
function validarConfirmPassword(input) {
    const confirmPassword = input.value.trim();
    const password = document.getElementById('passwordInput').value.trim();  // Obtener la contraseña del campo de la contraseña principal

    if (confirmPassword === '') {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'La contraseña no puede estar vacía.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    // Verificar si las contraseñas coinciden
    if (confirmPassword !== password) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: 'Las contraseñas no coinciden.',
            showConfirmButton: false,
            timer: 3000
        });
        return false;
    }

    return true;  // Si las contraseñas coinciden
}

</script>
